name: Lean proof

# Run explicitly; publishing a commit does not start CI automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LEAN_NUM_THREADS: '2'

jobs:
  proof:
    name: Build Lean proof and audit axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check fixed sources and statement definitions
        run: python3 lean/comparator/check-inputs.py --receipt-dir build-receipt
      - name: Prepare Lean and runner resources
        run: bash lean/comparator/prepare-runner.sh && bash lean/comparator/add-swap.sh 8 4
      - name: Install pinned Lean release from GitHub
        run: |
          toolchain='leanprover/lean4:v4.34.1'
          test "$(cat lean/lean-toolchain)" = "$toolchain"
          archive="$RUNNER_TEMP/lean-4.34.1-linux.tar.zst"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
          printf '%s  %s\n' \
            47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4 \
            "$archive" | sha256sum --check -
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          elan toolchain link "$toolchain" "$RUNNER_TEMP/lean-4.34.1-linux"
          elan run "$toolchain" lean --version
      - name: Download pinned Mathlib cache
        run: lake exe cache get
        working-directory: lean
      - name: Build completed proof and check allowed axioms
        run: bash comparator/build-proof.sh
        working-directory: lean
      - name: Record successful proof build
        run: |
          {
            echo '## Lean proof build passed'
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo 'Built `FCSolution`, `FCAudit` and `Calabi` with their dependencies.'
            echo 'The transitive axiom audit passed for all six principal declarations.'
            echo 'Comparator and fresh environment replay are not part of this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save proof build and axiom audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-proof-${{ github.sha }}
          path: build-receipt/
          retention-days: 90
          if-no-files-found: error
