name: Calabi theorem verification

on:
  push:
    branches: [main]
    paths: ['lean/**', 'leanWithoutComparator/**', 'FClikelean/**', '.github/workflows/comparator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calabi-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LEAN_NUM_THREADS: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 lean/comparator/check-inputs.py --receipt-dir build-receipt
      - run: bash lean/comparator/prepare-runner.sh && bash lean/comparator/add-swap.sh 8 4
      - run: lake exe cache get
        working-directory: lean
      - name: Build proof, ordinary entry point and transitive axiom audit
        run: bash comparator/build-proof.sh
        working-directory: lean
      - name: Compile the exact standalone draft against the pinned Mathlib
        run: lake env lean ../FClikelean/CalabiSmallEnergy.lean > ../build-receipt/fc-draft.log 2>&1
        working-directory: lean
      - uses: actions/cache/save@v4
        with:
          path: lean/.lake/build
          key: calabi-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-receipt/
          retention-days: 90
          if-no-files-found: error

  comparator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 lean/comparator/check-inputs.py --receipt-dir comparator-receipt
      - run: bash lean/comparator/prepare-runner.sh && bash lean/comparator/add-swap.sh 8 4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: lake exe cache get
        working-directory: lean
      - name: Compile trusted definitions and challenge before restoring proof products
        working-directory: lean
        run: |
          lake build Challenge
          mkdir -p "$RUNNER_TEMP/trusted-challenge"
          find .lake/build -type f \( -name 'Challenge.*' -o -name 'FCTargetDefinitions.*' \) -print0 | tar --null -T - -cf "$RUNNER_TEMP/trusted-challenge/files.tar"
      - name: Install fixed Comparator, exporter and Linux sandbox
        env:
          COMPARATOR_TOOLS: ${{ runner.temp }}/comparator-tools
        run: bash lean/comparator/install-tools.sh
      - uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: calabi-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Restore separately compiled trusted definitions and challenge
        run: tar -xf "$RUNNER_TEMP/trusted-challenge/files.tar"
        working-directory: lean
      - name: Comparator statement comparison, axiom audit and builtin kernel replay
        env:
          COMPARATOR_TOOLS: ${{ runner.temp }}/comparator-tools
        run: bash lean/comparator/run-check.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comparator-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparator-receipt/
          retention-days: 90
          if-no-files-found: error

  replay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash lean/comparator/prepare-runner.sh && bash lean/comparator/add-swap.sh 16 3
      - run: lake exe cache get
        working-directory: lean
      - uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: calabi-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Fresh kernel replay of the complete proof environment
        working-directory: lean
        run: |
          mkdir -p ../replay-receipt
          /usr/bin/time -v lake env leanchecker --fresh FCSolution > ../replay-receipt/replay.log 2> ../replay-receipt/time.log
          grep -q 'Exit status: 0' ../replay-receipt/time.log
          printf 'PASS\n' > ../replay-receipt/status.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: replay-receipt/
          retention-days: 90
          if-no-files-found: warn

  verification_status:
    needs: [build, comparator, replay]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all three completed checks
        env:
          BUILD: ${{ needs.build.result }}
          COMPARE: ${{ needs.comparator.result }}
          REPLAY: ${{ needs.replay.result }}
        run: |
          test "$BUILD" = success
          test "$COMPARE" = success
          test "$REPLAY" = success
